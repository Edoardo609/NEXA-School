<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Accedi • NEXA School</title><link rel="stylesheet" href="/style.css"><style>body{min-height:100vh;display:grid;place-items:center;padding:20px}.login{width:100%;max-width:430px}.login .card{text-align:center}.login-logo{width:72px;height:72px;border-radius:22px;display:grid;place-items:center;margin:0 auto 18px;background:linear-gradient(135deg,#6d5cff,#18b6ff);font-size:34px;font-weight:900}.login input{width:100%;padding:13px;border-radius:12px;border:1px solid #29415d;background:#091727;color:#fff;margin:8px 0}.login button{width:100%;margin-top:8px}.msg{min-height:20px;margin-top:12px;color:#8fa5bb;font-size:13px}.msg.err{color:#ff9eaa}</style></head><body><main class="login"><div class="card"><div class="login-logo">N</div><h1>NEXA School</h1><p class="note">Accedi al tuo spazio scolastico. Nessuna password: riceverai un codice via email.</p><form id="form"><input id="email" type="email" autocomplete="username webauthn" placeholder="La tua email" required><input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="Codice a 6 cifre" maxlength="6" hidden><button id="submit" class="add">Continua</button><button id="back" type="button" class="secondary" hidden>Usa un'altra email</button></form><div id="msg" class="msg"></div></div></main><script>(async()=>{const A=window.hatchable.auth,email=document.querySelector('#email'),code=document.querySelector('#code'),form=document.querySelector('#form'),submit=document.querySelector('#submit'),back=document.querySelector('#back'),msg=document.querySelector('#msg');let step='email';const next=(()=>{const n=new URLSearchParams(location.search).get('next')||'/';return n.startsWith('/')&&!n.startsWith('//')?n:'/';})();const say=(x,e)=>{msg.textContent=x;msg.className='msg '+(e?'err':'')};try{const s=await A.getSession();if(s?.user)location.replace(next)}catch{}form.onsubmit=async e=>{e.preventDefault();submit.disabled=true;try{if(step==='email'){await A.startLogin({email:email.value.trim()});step='code';email.hidden=true;code.hidden=false;back.hidden=false;submit.textContent='Accedi';say('Codice inviato. Controlla la tua email.');code.focus()}else{await A.verifyCode({email:email.value.trim(),code:code.value.trim()});location.replace(next)}}catch(err){say(err?.message||'Non è stato possibile completare l’accesso.',true)}finally{submit.disabled=false}};back.onclick=()=>{step='email';email.hidden=false;code.hidden=true;back.hidden=true;submit.textContent='Continua';say('');email.focus()};email.focus()})()</script></body></html>
